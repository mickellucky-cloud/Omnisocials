<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="omniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Orbital Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Drop Shadow for Nodes -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    fill="url(#omniBg)"
  />

  <!-- Specular Rim -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    fill="none"
    stroke="url(#specularGlow)"
    stroke-width="8"
  />

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="256" r="140" fill="#60A5FA" opacity="0.15" filter="url(#nodeGlow)" />

  <!-- Outer Interconnected Orbit Ring -->
  <circle
    cx="256"
    cy="256"
    r="130"
    fill="none"
    stroke="#93C5FD"
    stroke-opacity="0.3"
    stroke-width="8"
    stroke-dasharray="16 12"
  />

  <!-- Diagonal Flow Ellipse 1 -->
  <ellipse
    cx="256"
    cy="256"
    rx="145"
    ry="68"
    fill="none"
    stroke="url(#orbitGrad)"
    stroke-width="16"
    stroke-linecap="round"
    transform="rotate(-28 256 256)"
  />

  <!-- Diagonal Flow Ellipse 2 -->
  <ellipse
    cx="256"
    cy="256"
    rx="145"
    ry="68"
    fill="none"
    stroke="url(#orbitGrad)"
    stroke-width="16"
    stroke-linecap="round"
    transform="rotate(45 256 256)"
  />

  <!-- Center Enterprise Core Node -->
  <circle cx="256" cy="256" r="38" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="256" cy="256" r="22" fill="#2563EB" />
  <circle cx="256" cy="256" r="10" fill="#38BDF8" />

  <!-- 4 Satellite Network Nodes (Top, Right, Bottom, Left) -->
  <circle cx="256" cy="126" r="20" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="256" cy="126" r="11" fill="#0284C7" />

  <circle cx="386" cy="256" r="20" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="386" cy="256" r="11" fill="#7C3AED" />

  <circle cx="256" cy="386" r="20" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="256" cy="386" r="11" fill="#059669" />

  <circle cx="126" cy="256" r="20" fill="#FFFFFF" filter="url(#nodeGlow)" />
  <circle cx="126" cy="256" r="11" fill="#D97706" />

  <!-- Sparkle Accent in Core -->
  <path
    d="M 256 242 Q 256 256 242 256 Q 256 256 256 270 Q 256 256 270 256 Q 256 256 256 242 Z"
    fill="#FFFFFF"
  />
</svg>
